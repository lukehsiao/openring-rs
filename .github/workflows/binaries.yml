name: Binaries

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach binaries to (e.g. v0.5.4)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (e.g. v0.5.4)"
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use-cross: false
            ext: tar.gz
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            use-cross: true
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use-cross: true
            ext: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            use-cross: true
            ext: tar.gz
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-latest
            use-cross: true
            ext: tar.gz
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            use-cross: true
            ext: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            use-cross: false
            ext: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            use-cross: false
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            use-cross: false
            ext: zip
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            use-cross: false
            ext: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.use-cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Create archive (tar.gz)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir stage
          cp target/${{ matrix.target }}/release/openring LICENSE.md README.md stage/
          tar czf openring-${{ matrix.target }}.tar.gz \
            -C stage openring LICENSE.md README.md

      - name: Create archive (zip, Windows)
        if: matrix.ext == 'zip' && runner.os == 'Windows'
        shell: bash
        run: |
          mkdir stage
          cp target/${{ matrix.target }}/release/openring.exe LICENSE.md README.md stage/
          cd stage
          7z a ../openring-${{ matrix.target }}.zip openring.exe LICENSE.md README.md

      - name: Generate checksums
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            shasum -a 256 openring-${{ matrix.target }}.${{ matrix.ext }} > openring-${{ matrix.target }}.${{ matrix.ext }}.sha256
          else
            sha256sum openring-${{ matrix.target }}.${{ matrix.ext }} > openring-${{ matrix.target }}.${{ matrix.ext }}.sha256
          fi

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            openring-${{ matrix.target }}.${{ matrix.ext }} \
            openring-${{ matrix.target }}.${{ matrix.ext }}.sha256 \
            --clobber
